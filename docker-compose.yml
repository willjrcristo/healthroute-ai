version: "3.8"

services:
  healthroute-vrp:
    build: .
    container_name: healthroute_vrp
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/vrp
    volumes:
      - ./output:/app/output
    depends_on:
      - n8n
    networks:
      - healthroute_net

  n8n:
    image: n8nio/n8n:latest
    container_name: healthroute_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - healthroute_net

volumes:
  n8n_data:

networks:
  healthroute_net:
    driver: bridge
